<!DOCTYPE html>

<style>
:root{--bg:#0b1118;--p:#141d29;--p2:#1b2736;--bd:#2a3a4e;--tx:#e9e4d6;--mu:#93a1b3;--ac:#e0914f;--ac2:#c4631f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1b2b42,transparent),var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

#map svg{width:100%;height:100%;display:block;touch-action:none}

.zc button{width:36px;height:36px;padding:0;border-radius:10px;background:rgba(11,17,24,.75);border:1px solid var(--bd);font-size:18px}

.c{stroke:#07131f;stroke-width:.5;cursor:pointer;transition:fill .5s,filter .2s;vector-effect:non-scaling-stroke}.c:hover{filter:brightness(1.3)}
.lb{font-size:13px;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#000a;stroke-width:3px;pointer-events:none;font-weight:600}
.empty{padding:60px 16px;text-align:center;color:var(--mu)}
.card{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px;color:var(--ac)}
button,select,input,textarea{font:inherit;color:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--p2);padding:9px 12px;max-width:100%}
button{background:var(--ac2);border:0;color:#fff;cursor:pointer;margin:2px 0;font-weight:600}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.5;cursor:wait}
button.ghost{background:var(--p2);border:1px solid var(--bd);color:var(--tx)}
button.big{width:100%;padding:14px;font-size:17px}
input,textarea,select{width:100%}input[type=number]{width:120px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.mut{color:var(--mu);font-size:14px}.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row select{flex:1;min-width:140px;width:auto}.row button{width:auto}
.seg,.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button,.tabs button{flex:1;background:var(--p2);border:1px solid var(--bd);color:var(--mu)}
.seg button.on,.tabs button.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.tag,.chip{display:inline-block;font-size:12px;border:1px solid var(--bd);border-radius:20px;padding:2px 10px;margin:2px;background:var(--p2)}

.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{background:#2a1f1a;border:1px solid var(--ac2);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}

.hero h2{font-size:22px;font-family:Georgia,serif}
</style></head><body>
<header id="bar"></header>
<div id="wrap"><div id="mapbox"><div id="map"></div><div class="zc"><button onclick="zm(1.6)" aria-label="Zoom +">＋</button><button onclick="zm(0.625)" aria-label="Zoom -">－</button><button onclick="zm(0)" aria-label="Reset">⌂</button></div></div><aside id="side"><p class="mut">Chargement…</p></aside></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,updateDoc,onSnapshot,deleteField,deleteDoc,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm";
import {feature} from "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm";

/* ===== CONFIG FIREBASE (voir README) ===== */
const FB={apiKey:"AIzaSyDb5Skq2cTDRbkiVcRZ4qtjWSH2Yjwp2Zc",authDomain:"cap-historiageneraror.firebaseapp.com",projectId:"cap-historiageneraror",appId:"1:881302470164:web:8b1ad2fa05f4037807b101"};
/* ======================================== */

const DIFF={facile:"Monde clément : les ordres des joueurs réussissent souvent, les IA sont passives.",normal:"Équilibré et plausible.",réaliste:"Conséquences réalistes (logistique, économie, opinion, rivalités) ; les plans ambitieux échouent souvent.",difficile:"Impitoyable : IA agressives et opportunistes, crises, coups d'État et guerres fréquents."};
const GL="https://generativelanguage.googleapis.com/v1beta/models";
const app=initializeApp(FB),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)||""}catch{return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const J=(s,d)=>{try{return JSON.parse(s)}catch{return d}};
let user=null,ready=false,G=null,code="",feats=[],own_={},unsub=null,busy="",msg="",cfgOpen=false,CH=[],TAB="play",MAPDATA=null,curMJ=null;
let KEY=ls.get("gk"),MODEL=ls.get("gm")||"gemini-2.5-flash",PSEUDO=ls.get("pseudo"),MODELS=J(ls.get("gmodels"),[]);
const LIB=J(ls.get("maps"),[]).filter(m=>m&&m.t&&m.t[0]&&m.t[0].r>0);
const LF=window.LF={year:1936,diff:"normal",ctx:"",ai:false,md:"",mapObj:null,jc:""};
const D=window.D={};
window.side=()=>side();
const custom=()=>G?!!G.mapJson:LF.ai;
const names=()=>custom()?(MAPDATA?MAPDATA.t.map(t=>t.n):[]):feats.map(f=>f.properties.name);
const own=n=>own_[n]||n;
const me=()=>G&&user&&G.players&&G.players[user.uid]||null;
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h},45%,45%)`};
const colorOf=n=>{if(custom()&&MAPDATA){const t=MAPDATA.t.find(x=>x.n===n);if(t)return t.c}return hue(n)};
const nations=()=>[...new Set(names().map(own))].sort((a,b)=>a.localeCompare(b));
const say=m=>{msg=m;side()};

/* ---------- IA Gemini ---------- */
async function listModels(){
  const r=await fetch(GL+"?pageSize=200",{headers:{"x-goog-api-key":KEY}});
  if(!r.ok)throw Error("Clé refusée par Google ("+r.status+")");
  return ((await r.json()).models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace("models/","")).filter(n=>/^gemini/.test(n)&&!/image|tts|live|audio|embed/.test(n));
}
async function pickModel(){
  const l=await listModels().catch(()=>[]),ok=l.filter(n=>/flash/.test(n)&&!/exp|thinking|vision|robotics|computer/.test(n));
  return ok.filter(n=>/^gemini-[\d.]+-flash$/.test(n)).sort().pop()||ok.find(n=>/lite/.test(n))||ok[0]||null;
}
async function ask(p,json=true,retry=true){
  if(!KEY)throw Error("Ajoute ta clé Gemini dans ⚙️ Réglages.");
  const r=await fetch(`${GL}/${encodeURIComponent(MODEL)}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":KEY},body:JSON.stringify({contents:[{parts:[{text:p}]}],generationConfig:json?{responseMimeType:"application/json",temperature:.9}:{temperature:.8}})});
  if(!r.ok){
    let m="";try{m=(await r.json()).error.message||""}catch{}
    if((r.status==404||/not found|no longer available|not supported/i.test(m))&&retry){
      const n=await pickModel();if(n&&n!==MODEL){MODEL=n;ls.set("gm",n);return ask(p,json,false)}
    }
    throw Error(r.status==429?"Quota Gemini atteint, réessaie dans une minute.":(r.status==400||r.status==403)&&/API key/i.test(m)?"Clé Gemini invalide (⚙️ Réglages).":"Erreur Gemini "+r.status+(m?" : "+m.slice(0,160):""));
  }
  const j=await r.json(),t=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("");
  if(!t)throw Error("Réponse vide de l'IA (filtre de sécurité ?). Reformule.");
  if(!json)return t;
  try{return JSON.parse(t.replace(/^\s*```(?:json)?|```\s*$/g,"").trim())}catch{throw Error("Réponse IA illisible, réessaie.")}
}

/* ---------- Carte ---------- */
async function loadWorld(){
  if(feats.length)return;
  const t=await (await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json")).json();
  feats=feature(t,t.objects.countries).features.filter(f=>f.properties.name&&f.properties.name!=="Antarctica");
}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* Génère la géographie d'une carte IA : diagramme de Voronoï sur grille irrégulière + bruit, identique chez tous les joueurs (graine) */
function buildMap(M){
  const W=1000,H=750,S=10,R=rng(M.seed|0),T=M.t.map(t=>({...t})),pts=[];
  for(let y=S/2;y<H;y+=S)for(let x=S/2;x<W;x+=S)pts.push([x+(R()-.5)*S*.9,y+(R()-.5)*S*.9]);
  const a=R()*6,b=R()*6,c=R()*6,nz=(x,y)=>.5*Math.sin(x*.012+y*.008+a)+.3*Math.sin(x*.027-y*.021+b)+.2*Math.sin(x*.055+y*.047+c);
  let own;
  for(let k=0;k<4;k++){
    own=pts.map(([x,y])=>{let o=-1,bs=1;T.forEach((t,i)=>{const s=Math.hypot(x-t.x,y-t.y)/t.r*(1+.3*nz(x,y));if(s<bs){bs=s;o=i}});return o});
    const cnt=T.map(()=>0);own.forEach(o=>o>=0&&cnt[o]++);
    const low=cnt.map((n,i)=>n<25?i:-1).filter(i=>i>=0);
    if(!low.length)break;low.forEach(i=>T[i].r*=1.4);
  }
  const del=d3.Delaunay.from(pts),vor=del.voronoi([0,0,W,H]),g=T.map(()=>[]),poly=pts.map((_,i)=>vor.cellPolygon(i)||[]),f=v=>v.toFixed(1);
  own.forEach((o,i)=>{if(o>=0&&poly[i].length)g[o].push("M"+poly[i].map(p=>f(p[0])+" "+f(p[1])).join("L")+"Z")});
  const key=p=>Math.round(p[0]*10)+","+Math.round(p[1]*10),bd=[];
  pts.forEach((_,i)=>{const ks=new Set(poly[i].map(key));for(const j of del.neighbors(i)){if(j<=i||own[j]===own[i])continue;const sh=poly[j].filter(p=>ks.has(key(p)));if(sh.length>1)bd.push("M"+f(sh[0][0])+" "+f(sh[0][1])+"L"+f(sh[1][0])+" "+f(sh[1][1]))}});
  const sx=T.map(()=>[0,0,0]);own.forEach((o,i)=>{if(o>=0){sx[o][0]+=pts[i][0];sx[o][1]+=pts[i][1];sx[o][2]++}});
  return{items:T.map((t,i)=>({n:t.n,d:g[i].join(""),x:sx[i][2]?sx[i][0]/sx[i][2]:t.x,y:sx[i][2]?sx[i][1]/sx[i][2]:t.y})),bd:bd.join("")};
}
let zoomB=null,svgSel=null,lw=0,rt=0;
function drawMap(){
  const el=d3.select("#map").html("");let items=[],W=1000,H=560,bd="";
  if(custom()){
    if(!MAPDATA||!MAPDATA.t[0]||!(MAPDATA.t[0].r>0)){el.style("aspect-ratio","4/3").append("div").attr("class","empty").text("✨ Décris ta carte, puis génère-la.");return}
    H=750;const m=buildMap(MAPDATA);items=m.items;bd=m.bd;
  }else{
    if(!feats.length){el.style("aspect-ratio",null).append("div").attr("class","empty").text("Chargement de la carte…");return}
    const pa=d3.geoPath(d3.geoNaturalEarth1().fitSize([W,H],{type:"FeatureCollection",features:feats}));
    items=feats.map(f=>({n:f.properties.name,d:pa(f)}));
  }
  el.style("aspect-ratio",W+"/"+H);lw=el.node().clientWidth;
  const svg=el.append("svg").attr("viewBox",`0 0 ${W} ${H}`),g=svg.append("g");
  g.selectAll("path.c").data(items).join("path").attr("class","c").attr("d",d=>d.d).on("click",(e,d)=>pick(own(d.n))).append("title").text(d=>d.n);
  if(bd)g.append("path").attr("class","bd").attr("d",bd);
  const f0=Math.max(13,Math.min(34,11/((lw||360)/W)));
  if(custom())g.selectAll("text").data(items).join("text").attr("class","lb").attr("x",d=>d.x).attr("y",d=>d.y).style("font-size",f0+"px").text(d=>d.n);
  zoomB=d3.zoom().scaleExtent([1,14]).translateExtent([[0,0],[W,H]]).on("zoom",e=>{g.attr("transform",e.transform);g.selectAll("text").style("font-size",f0/e.transform.k+"px")});
  svgSel=svg.call(zoomB);
  colorMap();
}
function colorMap(){
  const mine=me()&&me().nation,cu=custom(),is=d=>mine&&own(d.n)===mine;
  d3.selectAll("#map path.c").style("fill",d=>colorOf(own(d.n))).style("stroke",d=>cu?colorOf(own(d.n)):is(d)?"#fff":null).style("stroke-width",d=>cu?.8:is(d)?2:null).style("filter",d=>cu&&is(d)?"brightness(1.35) drop-shadow(0 0 4px #fff)":null);
}
window.zm=k=>{if(!svgSel)return;k?svgSel.transition().duration(250).call(zoomB.scaleBy,k):svgSel.transition().duration(300).call(zoomB.transform,d3.zoomIdentity)};
addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{const w=$("#map").clientWidth;if(w&&Math.abs(w-lw)>40)drawMap()},300)});
function setMap(o){MAPDATA=o;drawMap()}

/* ---------- Interface ---------- */
function bar(){
  $("#bar").innerHTML=`<div class="logo">🌍 <b>Monde des Nations</b></div>`+(user?`<div><span class="chip">${esc(PSEUDO||"…")}</span> <button class="ghost" onclick="cfg()">⚙️</button> <button class="ghost" onclick="out()">⎋</button></div>`:"");
}
function settings(){
  const opts=[...new Set([MODEL,...MODELS,"gemini-2.5-flash","gemini-2.5-flash-lite","gemini-3-flash-preview"])];
  return `<div class="card"><h2>⚙️ Réglages</h2>
  <label>Pseudo (le seul nom visible par les autres joueurs)</label><input id="ps" maxlength="20" value="${esc(PSEUDO)}">
  <label>Clé API Gemini (gratuite : aistudio.google.com/apikey)</label><input id="ky" type="password" autocomplete="off" value="${esc(KEY)}">
  <label>Modèle IA</label><div class="row"><select id="md">${opts.map(o=>`<option ${o===MODEL?"selected":""}>${esc(o)}</option>`).join("")}</select><button class="ghost" onclick="loadModels()" ${busy?"disabled":""}>↻ Charger mes modèles</button></div>
  <p><button onclick="saveCfg()">Enregistrer</button></p></div>`;
}
function lobby(){
  return `<div class="card"><h2>🗺️ 1 · La carte</h2>
  <div class="seg"><button class="${LF.ai?"":"on"}" onclick="mk(0)">🌍 Monde réel</button><button class="${LF.ai?"on":""}" onclick="mk(1)">✨ Carte IA</button></div>
  ${LF.ai?`<textarea placeholder="Décris ta carte (monde réel ou imaginaire)…" oninput="LF.md=this.value">${esc(LF.md)}</textarea>
  <div>${["Un archipel de cités-États","La Terre du Milieu","L'Europe si Rome n'était jamais tombée","Un supercontinent futuriste en 2300"].map(i=>`<span class="tag" style="cursor:pointer" data-v="${esc(i)}" onclick="LF.md=this.dataset.v;side()">${esc(i)}</span>`).join("")}</div>
  <p><button onclick="genMap()" ${busy?"disabled":""}>${busy==="map"?"L'IA dessine…":"✨ Générer la carte"}</button></p>
  ${LIB.length?`<label>Cartes déjà générées (sans appel IA)</label><select onchange="useMap(this.value)"><option value="">— choisir —</option>${LIB.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("")}</select>`:""}`
  :`<p class="mut">Vraies frontières. Clique sur un pays pour l'explorer.</p>`}</div>
  <div class="card"><h2>📜 2 · Époque et difficulté</h2>
  <div class="row"><input type="number" value="${esc(LF.year)}" oninput="LF.year=this.value"> <span class="mut">Année de départ</span></div>
  <div class="seg" style="margin-top:8px">${Object.keys(DIFF).map(k=>`<button class="${k===LF.diff?"on":""}" onclick="LF.diff='${k}';side()">${k}</button>`).join("")}</div>
  <p class="mut small">${esc(DIFF[LF.diff])}</p>
  <textarea placeholder="Contexte historique (ou laisse l'IA l'écrire)" oninput="LF.ctx=this.value">${esc(LF.ctx)}</textarea>
  <p><button class="ghost" onclick="scen()" ${busy?"disabled":""}>${busy==="scen"?"L'IA écrit…":"✨ Générer le contexte"}</button></p></div>
  <button class="big" onclick="create()" ${busy?"disabled":""}>🚀 Créer la partie</button>
  <div class="card" style="margin-top:12px"><h2>🔑 Rejoindre une partie</h2><div class="row"><input placeholder="Code" value="${esc(LF.jc)}" oninput="LF.jc=this.value"><button onclick="join(LF.jc)">Rejoindre</button></div></div>`;
}
function game(){
  if(D.turn!==G.turn){D.d=undefined;D.turn=G.turn}
  const P=Object.entries(G.players||{}),m=me(),host=G.host===user.uid,od=(G.orders&&G.orders[user.uid])||"";
  let b="";
  if(TAB==="play"){
    b=!m?`<div class="card"><p>Tu n'es plus dans cette partie.</p><button onclick="join('${esc(code)}')">Revenir</button></div>`
    :!m.nation?`<div class="card"><h2>Choisis ta nation</h2><p class="mut">Clique sur la carte, ou utilise la liste (pratique pour les petits pays).</p><div class="row"><select id="nsel">${nations().filter(n=>!P.some(([,p])=>p.nation===n)).map(n=>`<option>${esc(n)}</option>`).join("")}</select><button onclick="pickSel(document.getElementById('nsel').value)">Jouer</button></div></div>`
    :`<div class="card"><h2>Tes ordres — ${esc(m.nation)}</h2><textarea oninput="D.d=this.value" placeholder="Que fait ton gouvernement cette année ?">${esc(D.d??od)}</textarea>
    <div class="row"><button class="ghost" onclick="send()">💾 Valider</button><button onclick="resolve()" ${busy?"disabled":""}>${busy==="turn"?"L'IA simule…":"⏩ Résoudre le tour"}</button></div></div>`;
  }else if(TAB==="adv"){
    b=!m||!m.nation?`<div class="card"><p class="mut">Choisis d'abord une nation.</p></div>`
    :`<div class="card"><h2>🧠 Ton conseiller</h2>${CH.slice(-6).map(c=>`<div class="ch"><b>${esc(c.r)} :</b> ${esc(c.t)}</div>`).join("")||`<p class="mut">Pose une question ou demande des idées d'ordres.</p>`}
    <input placeholder="Ta question…" value="${esc(D.q||"")}" oninput="D.q=this.value"><div class="row"><button onclick="advise(false)" ${busy?"disabled":""}>${busy==="adv"?"…":"Demander"}</button><button class="ghost" onclick="advise(true)" ${busy?"disabled":""}>💡 Suggérer des ordres</button></div></div>`;
  }else if(TAB==="log"){
    b=`<div class="card"><h2>📖 Contexte</h2><p class="mut">${esc(G.context)}</p></div><div class="card"><h2>📜 Chronique</h2>${(G.log||[]).slice().reverse().map(l=>`<div class="ev"><b>${esc(l.titre)}</b> <span class="mut">(${esc(l.year)})</span><p>${esc(l.recit)}</p>${(l.evenements||[]).map(e=>`<span class="tag">${esc(e.nation)} : ${esc(e.texte)}</span>`).join("")}</div>`).join("")||`<p class="mut">Rien pour l'instant.</p>`}</div>`;
  }else{
    b=`<div class="card"><h2>👥 Joueurs</h2>${P.map(([id,p])=>`<div><span class="sw" style="background:${p.nation?colorOf(own(p.nation)):"#555"}"></span>${esc(p.name)} — ${esc(p.nation||"…")}${id===user.uid?" (toi)":""}</div>`).join("")}</div>
    <div class="card"><h2>🔗 Inviter</h2><p class="mut">Code : <b>${esc(code)}</b></p><div class="row"><button onclick="copyLink()">📋 Copier le lien</button><button class="ghost" onclick="leave()">Quitter</button>${host?`<button class="ghost" onclick="del()">🗑️ Supprimer</button>`:""}</div></div>`;
  }
  return `<div class="card head"><b>Année ${esc(G.year)}</b><span>· Tour ${esc(G.turn)}</span><span class="tag">${esc(G.diff)}</span></div>
  <div class="tabs">${[["play","🎮 Jouer"],["adv","🧠 Conseiller"],["log","📜 Chronique"],["ppl","👥 Joueurs"]].map(([k,l])=>`<button class="${TAB===k?"on":""}" onclick="tab('${k}')">${l}</button>`).join("")}</div>`+b;
}
function side(){
  bar();const s=$("#side");
  if(!ready){s.innerHTML=`<p class="mut">Chargement…</p>`;return}
  const t=msg?`<div class="toast">${esc(msg)}</div>`:"";
  if(!user){s.innerHTML=`<div class="card hero"><h2>Dirige une nation. Réécris l'histoire.</h2><p class="mut">Géopolitique multijoueur propulsée par l'IA : cartes réelles ou inventées, scénarios historiques, conseiller personnel.</p><button class="big" onclick="login()">Se connecter avec Google</button><p class="mut small">Les autres joueurs ne voient jamais ton compte Google, seulement ton pseudo.</p></div>${t}`;return}
  const cfg=(cfgOpen||!PSEUDO||!KEY)?settings():"";
  s.innerHTML=cfg+t+(G?game():lobby());
}

/* ---------- Actions ---------- */
window.login=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>say(e.code==="auth/popup-blocked"?"Autorise les pop-ups pour ce site.":"Connexion impossible : "+e.code));
window.out=()=>{stop();signOut(auth)};
window.cfg=()=>{cfgOpen=!cfgOpen;side()};
window.tab=t=>{TAB=t;msg="";side()};
function readCfg(){const p=$("#ps"),k=$("#ky"),m=$("#md");if(p)PSEUDO=p.value.replace(/[<>]/g,"").trim().slice(0,20);if(k)KEY=k.value.trim();if(m&&m.value)MODEL=m.value}
window.loadModels=async()=>{
  readCfg();if(!KEY)return say("Colle d'abord ta clé Gemini.");
  busy="mod";side();
  try{MODELS=await listModels();ls.set("gmodels",JSON.stringify(MODELS));cfgOpen=true;msg=MODELS.length+" modèles trouvés pour ta clé.";if(!MODELS.includes(MODEL)&&MODELS.length)MODEL=MODELS.find(n=>/^gemini-[\d.]+-flash$/.test(n))||MODELS[0]}
  catch(e){msg=e.message}
  busy="";side();
};
window.saveCfg=async()=>{
  readCfg();if(!PSEUDO)return say("Choisis un pseudo.");
  ls.set("pseudo",PSEUDO);ls.set("gk",KEY);ls.set("gm",MODEL);cfgOpen=false;msg="";
  if(G&&me())try{await updateDoc(doc(db,"games",code),{[`players.${user.uid}.name`]:PSEUDO})}catch{}
  side();
  if(!G&&location.hash.length>1)join(location.hash.slice(1));
};
window.mk=a=>{LF.ai=!!a;setMap(a?LF.mapObj:null);side()};
window.useMap=id=>{const m=LIB.find(x=>x.id===id);if(m){LF.mapObj=m;LF.md=m.md||LF.md;setMap(m);side()}};
window.genMap=async()=>{
  if(!LF.md.trim())return say("Décris d'abord ta carte.");
  busy="map";msg="";side();
  try{
    const r=await ask(`Conçois la carte politique d'un jeu de géopolitique d'après cette demande (monde réel ou fictif) : « ${LF.md.slice(0,300)} ».
Canevas 1000x750. Donne 10 à 16 nations. Chacune a un centre (x de 80 à 920, y de 80 à 670), un rayon r (de 50 à 150) qui fixe sa taille, et une couleur. Les nations voisines doivent se toucher (distance entre centres inférieure à la somme des rayons), les continents sont séparés par de la mer, la disposition respecte la géographie de la demande.
Réponds UNIQUEMENT en JSON : {"name":"nom de la carte","context":"contexte historique ou univers en 4 à 6 phrases en français","t":[{"n":"Nom court (24 caractères max)","x":300,"y":200,"r":90,"c":"#aabbcc"}]}.`);
    const used=new Set;let t=[];
    for(const x of Array.isArray(r.t)?r.t:[]){
      const n=String(x.n||"").replace(/[\/]/g,"").trim().slice(0,24),X=+x.x,Y=+x.y,Rr=+x.r;
      if(!n||used.has(n)||![X,Y,Rr].every(Number.isFinite))continue;used.add(n);
      t.push({n,x:X,y:Y,r:Math.max(40,Math.min(170,Rr)),c:/^#[0-9a-f]{6}$/i.test(x.c)?x.c:hue(n)});
    }
    t=t.slice(0,18);if(t.length<4)throw Error("Carte invalide, réessaie avec une description plus précise.");
    const x0=Math.min(...t.map(p=>p.x-p.r)),x1=Math.max(...t.map(p=>p.x+p.r)),y0=Math.min(...t.map(p=>p.y-p.r)),y1=Math.max(...t.map(p=>p.y+p.r));
    const k=Math.max(.5,Math.min(1.8,Math.min(920/(x1-x0),690/(y1-y0))));
    t=t.map(p=>({...p,x:Math.round((p.x-(x0+x1)/2)*k+500),y:Math.round((p.y-(y0+y1)/2)*k+375),r:Math.round(p.r*k)}));
    const m={id:"m"+Date.now(),name:String(r.name||"Carte").slice(0,40),md:LF.md.slice(0,300),seed:Math.floor(Math.random()*1e9),t};
    LIB.push(m);while(LIB.length>8)LIB.shift();ls.set("maps",JSON.stringify(LIB));
    LF.mapObj=m;if(r.context)LF.ctx=String(r.context).slice(0,1500);setMap(m);
  }catch(e){msg=e.message}
  busy="";side();
};
window.scen=async()=>{
  busy="scen";msg="";side();
  try{
    const y=+LF.year||1936,n=names();
    const r=await ask(`Jeu de géopolitique ${custom()?"sur une carte inventée ("+(MAPDATA?MAPDATA.name:"")+")":"sur la carte du monde moderne"}. Année ${y}. Thème : "${LF.ctx||LF.md||"monde réel"}".
Noms de territoires valides (exactement) : ${n.join("; ")}.
Réponds en JSON : {"context":"contexte historique de 5 à 8 phrases en français (puissances, alliances, tensions)","owners":{"<nom valide>":"<nom en français de l'État qui le contrôle en ${y}>"}}. owners ne liste que les territoires dont le contrôleur diffère de leur nom (empires, colonies, URSS…), 150 entrées maximum.`);
    const o={};for(const [k,v] of Object.entries(r.owners||{}))if(n.includes(k)&&typeof v==="string"&&v.trim()&&v!==k)o[k]=v.trim().slice(0,40);
    LF.owners=o;LF.ctx=String(r.context||LF.ctx);
  }catch(e){msg=e.message}
  busy="";side();
};
window.create=async()=>{
  if(!PSEUDO||!KEY){cfgOpen=true;return say("Renseigne d'abord pseudo et clé Gemini.")}
  if(LF.ai&&!MAPDATA)return say("Génère d'abord une carte.");
  const c=Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[x%31]).join("");
  try{
    await setDoc(doc(db,"games",c),{host:user.uid,year:Math.trunc(+LF.year)||1936,turn:1,diff:LF.diff,context:(LF.ctx||"Monde réel.").slice(0,2000),ownersJson:JSON.stringify(LF.owners||{}),mapJson:LF.ai?JSON.stringify(MAPDATA):"",log:[],orders:{},players:{[user.uid]:{name:PSEUDO,nation:""}},created:Date.now()});
    LF.owners=null;TAB="play";watch(c);
  }catch(e){say("Création impossible : "+(e.code||e.message))}
};
window.join=async c=>{
  c=(c||"").trim().toUpperCase();
  if(!PSEUDO){cfgOpen=true;return say("Choisis d'abord un pseudo.")}
  if(!c)return say("Entre un code.");
  try{
    const s=await getDoc(doc(db,"games",c));if(!s.exists())return say("Code inconnu.");
    await updateDoc(doc(db,"games",c),{[`players.${user.uid}.name`]:PSEUDO,...((s.data().players||{})[user.uid]?{}:{[`players.${user.uid}.nation`]:""})});
    TAB="play";watch(c);
  }catch(e){say("Impossible de rejoindre : "+(e.code||e.message))}
};
function stop(){if(unsub)unsub();unsub=null;G=null;code="";own_={};CH=[];D.d=D.q=undefined;curMJ=null;MAPDATA=LF.ai?LF.mapObj:null;history.replaceState(null,"",location.pathname);drawMap()}
function watch(c){
  stop();code=c;msg="";history.replaceState(null,"","#"+c);
  unsub=onSnapshot(doc(db,"games",c),s=>{
    if(!s.exists()){stop();return say("La partie a été supprimée.")}
    G=s.data();own_=J(G.ownersJson||"{}",{});
    const mj=G.mapJson||"";
    if(mj!==curMJ){curMJ=mj;MAPDATA=mj?J(mj,null):null;drawMap()}else colorMap();
    const a=document.activeElement;if(!a||!["TEXTAREA","INPUT","SELECT"].includes(a.tagName))side();
  },e=>{stop();say("Connexion à la partie perdue : "+e.code)});
}
window.copyLink=async()=>{const l=location.origin+location.pathname+"#"+code;try{await navigator.clipboard.writeText(l);say("Lien copié ✓")}catch{say("Copie ce lien : "+l)}};
window.leave=async()=>{try{await updateDoc(doc(db,"games",code),{[`players.${user.uid}`]:deleteField()})}catch{}stop();side()};
window.del=async()=>{if(!confirm("Supprimer définitivement cette partie pour tout le monde ?"))return;try{await deleteDoc(doc(db,"games",code))}catch(e){say("Suppression impossible : "+e.code)}};
async function pick(n){
  if(!G||!me())return;
  if(me().nation)return say("Tu joues déjà "+me().nation+".");
  if(Object.values(G.players).some(p=>p.nation===n))return say(n+" est déjà prise.");
  try{await updateDoc(doc(db,"games",code),{[`players.${user.uid}.nation`]:n});say("")}catch(e){say("Choix impossible : "+e.code)}
}
window.pickSel=n=>n&&pick(n);
window.send=async()=>{
  try{await updateDoc(doc(db,"games",code),{[`orders.${user.uid}`]:String(D.d??"").slice(0,1500)});D.d=undefined;say("Ordres enregistrés ✓")}catch(e){say("Échec : "+e.code)}
};
const hist=()=>(G.log||[]).slice(-3).map(l=>`${l.year}: ${l.recit}`).join("\n")||"(début de partie)";
window.advise=async s=>{
  const m=me(),q=s?"Propose-moi 3 ordres concrets et réalistes pour ce tour.":(D.q||"").trim();
  if(!m||!m.nation||!q)return;
  CH.push({r:"Toi",t:s?"Suggère-moi des ordres.":q});D.q="";busy="adv";msg="";side();
  try{CH.push({r:"Conseiller",t:await ask(`Tu es le conseiller de ${m.nation} dans un jeu de géopolitique. Année ${G.year}. Contexte : ${G.context}. Difficulté : ${G.diff}. Événements récents :\n${hist()}\nContrôleurs modifiés : ${G.ownersJson}.\nQuestion du dirigeant : ${q}\nRéponds en français en moins de 120 mots, concret et fidèle à l'époque. Ne révèle rien des ordres des autres joueurs.`,false)})}
  catch(e){CH.push({r:"⚠️",t:e.message})}
  busy="";side();
};
window.resolve=async()=>{
  busy="turn";msg="";side();
  try{
    const o=G.orders||{},n=names(),ords=Object.entries(G.players).filter(([id,p])=>p.nation&&o[id]).map(([id,p])=>`- ${p.nation} (joueur ${p.name}) : ${o[id]}`).join("\n")||"(aucun ordre)";
    const r=await ask(`Tu es le moteur d'un jeu de géopolitique multijoueur. Année : ${G.year}. Contexte : ${G.context}. Difficulté : ${G.diff} — ${DIFF[G.diff]||""}.
Contrôleurs actuels qui diffèrent du nom d'origine : ${G.ownersJson}.
Noms de territoires valides (exactement) : ${n.join("; ")}.
Historique récent :\n${hist()}
Ordres des joueurs :\n${ords}
Toutes les autres nations sont dirigées par toi, de façon cohérente et plausible selon l'époque.
Simule les 12 prochains mois. Réponds UNIQUEMENT en JSON : {"titre":"","recit":"4 à 6 phrases en français","evenements":[{"nation":"","texte":"court"}],"changements":[{"pays":"<nom valide>","proprietaire":"<nom de l'État>"}]}. 3 à 8 événements ; changements seulement si des territoires changent de main.`);
    const w={...own_};
    (Array.isArray(r.changements)?r.changements:[]).forEach(c=>{if(!c||!n.includes(c.pays))return;const v=typeof c.proprietaire==="string"?c.proprietaire.trim().slice(0,40):"";if(!v||v===c.pays)delete w[c.pays];else w[c.pays]=v});
    const entry={titre:String(r.titre||"Nouveau tour").slice(0,120),recit:String(r.recit||"").slice(0,1500),year:G.year,evenements:(Array.isArray(r.evenements)?r.evenements:[]).slice(0,8).map(e=>({nation:String(e.nation||"").slice(0,40),texte:String(e.texte||"").slice(0,200)}))};
    const ref=doc(db,"games",code),turn=G.turn;
    await runTransaction(db,async t=>{
      const s=await t.get(ref);if(!s.exists()||s.data().turn!==turn)throw Error("Ce tour a déjà été résolu par un autre joueur.");
      t.update(ref,{year:s.data().year+1,turn:turn+1,orders:{},ownersJson:JSON.stringify(w),log:[...(s.data().log||[]),entry].slice(-30)});
    });
    D.d=undefined;TAB="log";
  }catch(e){msg=e.message||"Erreur"}
  busy="";side();
};

onAuthStateChanged(auth,async u=>{
  user=u;ready=true;side();
  if(!u){stop();return}
  try{await loadWorld();drawMap()}catch{return say("Impossible de charger la carte. Recharge la page.")}
  if(location.hash.length>1&&PSEUDO)join(location.hash.slice(1));
});
</script></body></html>
