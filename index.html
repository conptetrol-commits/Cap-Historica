const VM=/male|homme|thomas|daniel|jorge|diego|pablo|yuri|pavel|maxim|mikhail|kangkang|yunyang|yunjian|david|mark|james|oliver|google uk english male/i,VF=/female|femme|amelie|amélie|audrey|marie|aurelie|samantha|karen|paulina|monica|helena|milena|tatyana|katya|xiaoxiao|yaoyao|huihui|tingting|sin-ji|zira|hazel|google français|google español|google русский|google 普通话/i;
const hasTTS="speechSynthesis"in window;let VOICES=[],spk=0;
const refreshVoices=()=>{if(hasTTS){VOICES=speechSynthesis.getVoices()||[];if(cfgOpen&&!busy)side()}};
if(hasTTS){VOICES=speechSynthesis.getVoices()||[];speechSynthesis.onvoiceschanged=refreshVoices}
const waitVoices=()=>new Promise(res=>{if(!hasTTS||VOICES.length)return res();let n=0;const iv=setInterval(()=>{VOICES=speechSynthesis.getVoices()||[];if(VOICES.length||++n>15){clearInterval(iv);res()}},100)});
const gOf=v=>VF.test(v.name)&&!VM.test(v.name)?"f":VM.test(v.name)&&!VF.test(v.name)?"m":"?";
const voicesFor=li=>VOICES.filter(v=>v.lang.toLowerCase().replace("_","-").startsWith(LN[li??LI][0]));
const pickVoice=li=>{const vs=voicesFor(li);return vs.find(v=>v.name===NAR.v)||vs.find(v=>gOf(v)===NAR.g)||vs.find(v=>v.localService)||vs[0]||null};
const chunks=x=>{const a=String(x).replace(/\s+/g," ").trim().split(/(?<=[.!?…。！？])\s*/),o=[];let c="";for(const q of a){if(c&&(c+" "+q).length>170){o.push(c);c=q}else c=(c+" "+q).trim()}if(c)o.push(c);return o.flatMap(q=>q.length>200?q.match(/.{1,180}(\s|$)/g):[q])};
async function speak(txt,li){
  if(!hasTTS||!txt)return;li=Number.isInteger(li)&&LN[li]?li:LI;
  const my=++spk;speechSynthesis.cancel();await waitVoices();if(my!==spk)return;
  const q=chunks(txt),v=pickVoice(li);let i=0;
  const next=()=>{
    if(my!==spk||i>=q.length)return;
    const idx=i++,u=new SpeechSynthesisUtterance(q[idx]);u.lang=v?v.lang:LN[li][3];if(v)u.voice=v;u.rate=NAR.r;u.pitch=NAR.p;u.volume=1;
    let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(safe);next()};
    const safe=setTimeout(()=>{if(my===spk&&!done){speechSynthesis.cancel();fin()}},5000+q[idx].length*140/NAR.r);
    u.onend=fin;u.onerror=e=>{if(e.error==="interrupted"||e.error==="canceled"){done=true;clearTimeout(safe);return}fin()};
    if(speechSynthesis.paused)speechSynthesis.resume();speechSynthesis.speak(u);
  };
  setTimeout(next,80);
}

Réponds UNIQUEMENT en JSON : {"name":"nom de la carte","context":"contexte historique ou univers en 4 à 6 phrases","t":[{"n":"Nom court (24 caractères max)","x":300,"y":200,"r":90,"c":"#aabbcc","gov":"régime","cap":"capitale","cities":["ville1","ville2","ville3"],"pop":12.5,"gdp":300,"army":60,"eco":55,"tech":70,"stab":40,"res":["fer","blé"],"desc":"une phrase sur la nation"}],"f":[{"k":"mountain","x":400,"y":250,"r":60,"n":"Monts Aurelian"}]}. pop en millions d'habitants, gdp en milliards de dollars.`);
    const used=new Set,num=(v,lo,hi,d)=>{v=+v;return Number.isFinite(v)?Math.max(lo,Math.min(hi,v)):d};let tt_=[];
    for(const x of Array.isArray(r.t)?r.t:[]){
      const n=String(x.n||"").replace(/[\/]/g,"").trim().slice(0,24),X=+x.x,Y=+x.y,Rr=+x.r;
      if(!n||used.has(n)||![X,Y,Rr].every(Number.isFinite))continue;used.add(n);
      tt_.push({n,x:X,y:Y,r:Math.max(40,Math.min(150,Rr)),c:/^#[0-9a-f]{6}$/i.test(x.c)?x.c:hue(n),gov:String(x.gov||"").slice(0,40),cap:String(x.cap||"").slice(0,30),cities:(Array.isArray(x.cities)?x.cities:[]).map(v=>String(v).slice(0,24)).slice(0,3),pop:Math.round(num(x.pop,.01,2000,10)*10)/10,gdp:Math.round(num(x.gdp,.1,30000,100)*10)/10,army:Math.round(num(x.army,0,100,50)),eco:Math.round(num(x.eco,0,100,50)),tech:Math.round(num(x.tech,0,100,50)),stab:Math.round(num(x.stab,0,100,50)),res:(Array.isArray(x.res)?x.res:[]).map(v=>String(v).slice(0,24)).slice(0,3),desc:String(x.desc||"").slice(0,160)});
    }
    tt_=tt_.slice(0,18);if(tt_.length<4)throw Error(t("Carte invalide : réessaie avec une description plus précise."));
    const x0=Math.min(...tt_.map(p=>p.x-p.r)),x1=Math.max(...tt_.map(p=>p.x+p.r)),y0=Math.min(...tt_.map(p=>p.y-p.r)),y1=Math.max(...tt_.map(p=>p.y+p.r));
    const k=Math.max(.5,Math.min(1.8,Math.min(930/(x1-x0),540/(y1-y0))));
    const mx=(x0+x1)/2,my=(y0+y1)/2;
    tt_=tt_.map(p=>({...p,x:Math.round((p.x-mx)*k+500),y:Math.round((p.y-my)*k+300),r:Math.round(p.r*k)}));
    const FK=["mountain","desert","forest","jungle","ice","lake","sea"],f=(Array.isArray(r.f)?r.f:[]).filter(q=>q&&FK.includes(q.k)&&[q.x,q.y,q.r].every(v=>Number.isFinite(+v))).slice(0,16).map(q=>({k:q.k,x:Math.round((+q.x-mx)*k+500),y:Math.round((+q.y-my)*k+300),r:Math.round(Math.max(20,Math.min(120,+q.r*k))),n:String(q.n||"").slice(0,28)}));
    const m={v:3,id:"m"+Date.now(),name:String(r.name||"Carte").slice(0,40),md:LF.md.slice(0,300),seed:Math.floor(Math.random()*1e9),p:{sea:LF.sea,rel:LF.rel,frag:LF.frag},t:tt_,f};
    LIB.push(m);while(LIB.length>8)LIB.shift();ls.set("maps",JSON.stringify(LIB));

  }catch(e){toast("⚠️ "+e.message,9000)}

async function loadMine(){

    const s=await getDoc(doc(db,"users",user.uid)),codes=s.exists()?(s.data().games||[]):[],out=[];
    for(const c of codes){try{
      const g=await getDoc(doc(db,"games",c));if(!g.exists()||!(g.data().players||{})[user.uid])continue;

      if(Date.now()-(d.lastActive||d.created||Date.now())>14*DAY){try{await deleteDoc(doc(db,"games",c));continue}catch{}}
      out.push({c,...d});

const normEmail=e=>{let [l,d]=String(e).toLowerCase().split("@");l=(l||"").split("+")[0];if(d==="gmail.com"||d==="googlemail.com"){l=l.replace(/\./g,"");d="gmail.com"}return l+"@"+d};
const sha=async s=>Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s))),b=>b.toString(16).padStart(2,"0")).join("");
async function claimEmail(){
  if(!user.email)return true;

  try{
    const ref=doc(db,"emails",await sha(normEmail(user.email))),s=await getDoc(ref);
    if(s.exists())return s.data().uid===user.uid;
    await setDoc(ref,{uid:user.uid});return true;
  }catch(e){return false}
}
