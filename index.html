const bad=async r=>{let m="";try{const j=await r.json();m=j.error?.message||j.error||j.message||""}catch{}return typeof m==="string"?m:JSON.stringify(m)};

}

/* ---------- Monde réel : Natural Earth + tuiles ---------- */
const SRC=["https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_admin_0_countries.geojson","https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson"];

/* ---------- Carte inventée : relief procédural (bruit fractal) ---------- */
const TW=1000,TH=600,SC=1;
function noise(seed){
  const H=(x,y)=>{let h=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(seed,1274126177);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};

  return(x,y,o)=>{let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f);f*=2;a*=.5}return s};
}
const hex=c=>{const n=parseInt(String(c).slice(1),16)||0;return[n>>16&255,n>>8&255,n&255]};

function gflag(n,c){

  const c2=`hsl(${h%360},55%,45%)`,c3=`hsl(${(h*7)%360},60%,88%)`,a=c||c2;
  const b=[`<rect width="48" height="11" fill="${a}"/><rect y="11" width="48" height="10" fill="${c3}"/><rect y="21" width="48" height="11" fill="${c2}"/>`,
  `<rect width="16" height="32" fill="${a}"/><rect x="16" width="16" height="32" fill="${c3}"/><rect x="32" width="16" height="32" fill="${c2}"/>`,
  `<rect width="48" height="32" fill="${a}"/><rect x="14" width="8" height="32" fill="${c3}"/><rect y="12" width="48" height="8" fill="${c3}"/>`,
  `<rect width="48" height="32" fill="${c3}"/><circle cx="24" cy="16" r="9" fill="${a}"/>`,
  `<rect width="48" height="32" fill="${a}"/><path d="M0 32L48 0V32Z" fill="${c2}"/>`][h%5];
  return `<svg class="fl" viewBox="0 0 48 32">${b}</svg>`;
}

window.genMap=async()=>{
  if(!LF.md.trim())return say("Décris d'abord ton monde.");
  busy="map";msg="";side();
  try{
    const r=await ask(`Conçois la carte politique et les nations jouables d'un jeu de géopolitique d'après cette demande (monde réel ou fictif) : « ${LF.md.slice(0,300)} ».
Canevas 1000x600. Donne 10 à 16 nations crédibles et variées (noms, régimes, capitales cohérents avec l'univers). Chacune a un centre (x de 80 à 920, y de 70 à 530), un rayon r (de 50 à 140) qui fixe sa taille, une couleur et des attributs de jeu. Les nations voisines se touchent (distance entre centres inférieure à la somme des rayons) pour former des continents ; sépare les continents par de la mer ; respecte la géographie de la demande. Les notes (army, eco, tech, stab) vont de 0 à 100 et doivent différer d'une nation à l'autre : des puissances, des nations moyennes, des petits États fragiles.
Réponds UNIQUEMENT en JSON : {"name":"nom de la carte","context":"contexte historique ou univers en 4 à 6 phrases en français","t":[{"n":"Nom court (24 caractères max)","x":300,"y":200,"r":90,"c":"#aabbcc","gov":"régime","cap":"capitale","pop":12.5,"gdp":300,"army":60,"eco":55,"tech":70,"stab":40,"res":["fer","blé"],"desc":"une phrase sur la nation"}]}. pop en millions d'habitants, gdp en milliards de dollars.`);
    const used=new Set,num=(v,lo,hi,d)=>{v=+v;return Number.isFinite(v)?Math.max(lo,Math.min(hi,v)):d};let t=[];
    for(const x of Array.isArray(r.t)?r.t:[]){
      const n=String(x.n||"").replace(/[\/]/g,"").trim().slice(0,24),X=+x.x,Y=+x.y,Rr=+x.r;
      if(!n||used.has(n)||![X,Y,Rr].every(Number.isFinite))continue;used.add(n);
      t.push({n,x:X,y:Y,r:Math.max(40,Math.min(150,Rr)),c:/^#[0-9a-f]{6}$/i.test(x.c)?x.c:hue(n),gov:String(x.gov||"").slice(0,40),cap:String(x.cap||"").slice(0,30),pop:Math.round(num(x.pop,.01,2000,10)*10)/10,gdp:Math.round(num(x.gdp,.1,30000,100)*10)/10,army:Math.round(num(x.army,0,100,50)),eco:Math.round(num(x.eco,0,100,50)),tech:Math.round(num(x.tech,0,100,50)),stab:Math.round(num(x.stab,0,100,50)),res:(Array.isArray(x.res)?x.res:[]).map(v=>String(v).slice(0,24)).slice(0,3),desc:String(x.desc||"").slice(0,160)});
    }
    t=t.slice(0,18);if(t.length<4)throw Error("Carte invalide, réessaie avec une description plus précise.");
    const x0=Math.min(...t.map(p=>p.x-p.r)),x1=Math.max(...t.map(p=>p.x+p.r)),y0=Math.min(...t.map(p=>p.y-p.r)),y1=Math.max(...t.map(p=>p.y+p.r));
    const k=Math.max(.5,Math.min(1.8,Math.min(930/(x1-x0),540/(y1-y0))));
    t=t.map(p=>({...p,x:Math.round((p.x-(x0+x1)/2)*k+500),y:Math.round((p.y-(y0+y1)/2)*k+300),r:Math.round(p.r*k)}));
    const m={v:2,id:"m"+Date.now(),name:String(r.name||"Carte").slice(0,40),md:LF.md.slice(0,300),seed:Math.floor(Math.random()*1e9),t};
    LIB.push(m);while(LIB.length>8)LIB.shift();ls.set("maps",JSON.stringify(LIB));
    SEL="";LF.mapObj=m;if(r.context)LF.ctx=String(r.context).slice(0,1500);MAPDATA=m;drawMap();
  }catch(e){msg=e.message}
  busy="";side();
};

  try{CH.push({r:"Conseiller",t:await ask(`Tu es le conseiller de ${m.nation} dans un jeu de géopolitique. Date : ${dateStr(G)}. Contexte : ${G.context}. Difficulté : ${G.diff}. Événements récents :\n${hist()}\nContrôleurs modifiés : ${G.ownersJson}.\nQuestion du dirigeant : ${q}\nRéponds en français en moins de 120 mots, concret et fidèle à l'époque. Ne révèle rien des ordres des autres joueurs.`,false)})}
  catch(e){CH.push({r:"⚠️",t:e.message})}
  busy="";side();
};
async function resolve(){
  if(busy)return;busy="turn";msg="";side();
  try{
    const step=G.step||12,cu=custom(),o=G.orders||{},n=names(),ords=Object.entries(G.players).filter(([id,p])=>p.nation&&o[id]).map(([id,p])=>`- ${p.nation} (joueur ${p.name}) : ${o[id]}`).join("\n")||"(aucun ordre)";
    const r=await ask(`Tu es le moteur d'un jeu de géopolitique multijoueur. Date : ${dateStr(G)}. Contexte : ${G.context}. Difficulté : ${G.diff} — ${DIFF[G.diff]||""}.
Contrôleurs actuels qui diffèrent du nom d'origine : ${G.ownersJson}.
Noms de territoires valides (exactement) : ${n.join("; ")}.
${cu&&MAPDATA?"Attributs des nations : "+JSON.stringify(MAPDATA.t.map(t=>({n:t.n,gov:t.gov,pop:t.pop,gdp:t.gdp,army:t.army,eco:t.eco,tech:t.tech,stab:t.stab})))+"\n":""}Historique récent :\n${hist()}
Ordres des joueurs :\n${ords}
${G.aiOthers===false?"Les nations non jouées restent passives et n'agissent pas.":"Toutes les autres nations sont dirigées par toi, de façon cohérente et plausible selon l'époque."}
Simule les ${step} prochains mois. Réponds UNIQUEMENT en JSON : {"titre":"","recit":"4 à 6 phrases en français","evenements":[{"nation":"","texte":"court","ic":"un emoji",${cu?'"x":500,"y":300':'"lat":0,"lng":0'}}],"changements":[{"pays":"<nom valide>","proprietaire":"<nom de l'État>"}]}. 3 à 8 événements localisés sur la carte (${cu?"x de 0 à 1000, y de 0 à 600":"latitude et longitude réelles"}) ; changements seulement si des territoires changent de main (conquête, traité, indépendance).`);
    const w={...own_};
    (Array.isArray(r.changements)?r.changements:[]).forEach(c=>{if(!c||!n.includes(c.pays))return;const v=typeof c.proprietaire==="string"?c.proprietaire.trim().slice(0,40):"";if(!v||v===c.pays)delete w[c.pays];else w[c.pays]=v});
    const nu=v=>Number.isFinite(+v)&&v!==null&&v!==""?+v:undefined;
    const evs=(Array.isArray(r.evenements)?r.evenements:[]).slice(0,8).map(e=>{const q={nation:String(e.nation||"").slice(0,40),texte:String(e.texte||"").slice(0,200),ic:String(e.ic||"📍").slice(0,4)};
      if(cu){const x=nu(e.x),y=nu(e.y);if(x!==undefined&&y!==undefined){q.x=Math.max(0,Math.min(1000,x));q.y=Math.max(0,Math.min(600,y))}}
      else{const a=nu(e.lat),b=nu(e.lng);if(a!==undefined&&b!==undefined&&Math.abs(a)<=85&&Math.abs(b)<=180){q.lat=a;q.lng=b}}return q});
    const ref=doc(db,"games",code),turn=G.turn;
    await runTransaction(db,async t=>{
      const s=await t.get(ref);if(!s.exists()||s.data().turn!==turn)throw Error("Ce tour a déjà été résolu par un autre joueur.");
      const d=s.data(),m0=(d.month||1)-1+(d.step||12),ny=d.year+Math.floor(m0/12),nm=m0%12+1;
      t.update(ref,{year:ny,month:nm,turn:turn+1,orders:{},ownersJson:JSON.stringify(w),...touch(),log:[...(d.log||[]),{titre:String(r.titre||"Nouveau tour").slice(0,120),recit:String(r.recit||"").slice(0,1500),year:d.year,date:dateStr(d),evenements:evs}].slice(-30)});
    });
    D.d=undefined;TAB="log";
  }catch(e){msg=e.message||"Erreur"}
  busy="";side();
}
